name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "terraform/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: cashonrails-live
  REGION: africa-south1
  IMAGE: africa-south1-docker.pkg.dev/cashonrails-live/cashonrails/api

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  build:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # Pinned direct install: fewer third-party actions in the supply
      # chain, and the marketplace action's installer proved flaky.
      - name: Scan image (Trivy)
        run: |
          TRIVY_VERSION=0.74.0
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar xz -C /tmp trivy
          /tmp/trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE:${{ github.sha }}"

      - name: Push image
        run: docker push "$IMAGE:${{ github.sha }}"

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        run: |
          gcloud run jobs update cor-staging-migrate \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" --quiet
          gcloud run jobs execute cor-staging-migrate \
            --region "$REGION" --wait

      - name: Deploy revision
        run: |
          gcloud run deploy cor-staging \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe cor-staging \
            --region "$REGION" --format='value(status.url)')
          BASE_URL="$URL" ./scripts/smoke-test.sh

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: deploy-staging
    # The production environment carries a required-reviewer protection rule,
    # so this job pauses for manual approval.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        run: |
          gcloud run jobs update cor-prod-migrate \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" --quiet
          gcloud run jobs execute cor-prod-migrate \
            --region "$REGION" --wait

      - name: Deploy revision
        run: |
          gcloud run deploy cor-prod \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe cor-prod \
            --region "$REGION" --format='value(status.url)')
          BASE_URL="$URL" ./scripts/smoke-test.sh
